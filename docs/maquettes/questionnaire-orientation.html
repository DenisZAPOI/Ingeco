  --color-text: #1a1a1a;

  };
  const icon = (name, cls) => '<svg' + (cls ? ' class="' + cls + '"' : '') + ' viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">' + ICONS[name] + '</svg>';
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  // --- The seven questions (cahier des charges §7.1) --------------------------------
  // Codes match the proposal of issue #50 (code_question / code_reponse).
  const QUESTIONS = [
    { code: 'situation', multi: false, title: "Aujourd'hui, quelle est votre situation ?",
      options: [
        ['sans_emploi', 'Je n\'ai pas de travail', 'search'],

        ['en_emploi', 'J\'ai un travail, je cherche autre chose', 'briefcase'],
        ['en_formation', 'Je suis en formation ou à l\'école', 'book'],
        ['reprise', 'Je reprends après une longue pause', 'restart', 'Pour la famille ou une autre raison']
      ] },
    { code: 'projet', multi: false, title: "Qu'aimeriez-vous faire ?",
      options: [
        ['travail_vite', 'Trouver un travail rapidement', 'briefcase'],
        ['formation', 'Apprendre un métier', 'book'],
        ['creer', 'Créer mon activité', 'shop'],
        ['ne_sait_pas', 'Je ne sais pas encore', 'question']
      ] },
    { code: 'experiences', multi: true, title: "Qu'avez-vous déjà fait, même sans être payé ?",
      hint: 'Tout compte : aider la famille, le bénévolat, les petits travaux. Plusieurs réponses possibles.',
      free: { label: 'Autre chose ? (facultatif)', placeholder: 'Exemple : je répare les scooters du quartier' },
      options: [
        ['agriculture', 'Agriculture, abattis', 'leaf'],
        ['peche', 'Pêche', 'fish'],
        ['artisanat', 'Artisanat', 'hammer'],
        ['garde_enfants', 'Garde d\'enfants', 'pram'],
        ['aide_personne', 'Aide à une personne âgée', 'user'],
        ['menage', 'Ménage, entretien', 'broom'],
        ['batiment', 'Bâtiment, travaux', 'bricks'],
        ['cuisine', 'Cuisine', 'pot'],
        ['vente', 'Vente, marché', 'basket'],
        ['benevolat', 'Bénévolat, association', 'heart'],
        ['aucune', 'Rien pour l\'instant', 'none', null, true]
      ] },
    { code: 'disponibilites', multi: true, title: 'Quand pouvez-vous travailler ?',
      hint: 'Plusieurs réponses possibles.',
      options: [
        ['matin', 'Le matin', 'sun'],
        ['apres_midi', 'L\'après-midi', 'sunset'],
        ['soir', 'Le soir', 'moon'],
        ['nuit', 'La nuit', 'stars'],
        ['week_end', 'Le week-end', 'calendar']
      ] },
    { code: 'besoins', multi: true, title: "De quoi auriez-vous besoin pour avancer ?",
      hint: 'Plusieurs réponses possibles. Nous vous proposerons de l\'aide pour chacune.',
      options: [
        ['trajet', 'Un trajet', 'car', 'Pas de permis ou pas de voiture'],
        ['vehicule_adapte', 'Un véhicule adapté', 'wheelchair', 'Pour un fauteuil roulant'],
        ['garde', 'Une garde pour mes enfants', 'pram'],
        ['logement', 'Un logement', 'house'],
        ['demarches', 'De l\'aide pour mes démarches', 'form'],
        ['numerique', 'Apprendre à utiliser le téléphone ou internet', 'laptop'],
        ['francais', 'Mieux lire et écrire le français', 'book'],
        ['equipement', 'Des vêtements ou du matériel de travail', 'shirt'],
        ['aucun', 'Rien de tout ça', 'none', null, true]
      ] },
    { code: 'langues', multi: true, title: 'Quelles langues parlez-vous ?',
      hint: 'Plusieurs réponses possibles.',
      options: [
        ['fr', 'Français', 'chat'],
        ['gcr', 'Créole guyanais', 'chat'],
        ['ht', 'Créole haïtien', 'chat'],
        ['pt', 'Portugais', 'chat'],
        ['es', 'Espagnol', 'chat'],
        ['en', 'Anglais', 'chat'],
        ['nenge', 'Nenge (bushinenge)', 'chat'],
        ['autre', 'Une autre langue', 'chat']
      ] },
    { code: 'equipement_numerique', multi: true, title: "Qu'avez-vous pour aller sur internet ?",
      hint: 'Plusieurs réponses possibles.',
      options: [
        ['smartphone', 'Un téléphone avec internet', 'mobile'],
        ['ordinateur', 'Un ordinateur', 'laptop'],
        ['internet_maison', 'Internet à la maison', 'wifi'],
        ['email', 'Une adresse e-mail', 'mail'],
        ['rien', 'Rien de tout ça', 'none', null, true]
      ] }
  ];
  const label = (qCode, aCode) => {
    const q = QUESTIONS.find((x) => x.code === qCode);
    const o = q && q.options.find((x) => x[0] === aCode);
    return o ? o[1] : aCode;
  };

  // --- State --------------------------------------------------------------------------
  const empty = () => ({ answers: {}, free: '', done: {}, phone: '', when: 'peu_importe', loggedIn: false });
  let state = empty();
  const JORDAN = {
    answers: {
      situation: ['sans_emploi'], projet: ['travail_vite'], experiences: ['agriculture', 'benevolat'],
      disponibilites: ['matin', 'apres_midi'], besoins: ['trajet'], langues: ['fr', 'gcr'],
      equipement_numerique: ['smartphone']
    },
    free: 'J\'aide mon oncle à l\'abattis le week-end', done: {}, phone: '0694 12 34 56', when: 'matin', loggedIn: false
  };
  const has = (q, a) => (state.answers[q] || []).includes(a);
  const list = (q) => (state.answers[q] || []).map((a) => label(q, a).toLowerCase());
  const joinFr = (arr) => arr.length <= 1 ? (arr[0] || '') : arr.slice(0, -1).join(', ') + ' et ' + arr[arr.length - 1];

  // --- Rules of the plan: written in advance, each one explains itself ---------------
  // Order: the project first, then one step per need, then filler steps up to 3.
  // At most 5 steps (cahier des charges §7.1).
  function buildPlan() {
    const steps = [];
    const why = (q) => 'Vous avez répondu « ' + list(q).map((x) => x.charAt(0).toUpperCase() + x.slice(1)).join(' », « ') + ' ».';
    const projet = (state.answers.projet || [])[0];
    const exp = (state.answers.experiences || []).filter((x) => x !== 'aucune');
    const dispo = list('disponibilites');

    if (projet === 'travail_vite' || (!projet && has('situation', 'sans_emploi'))) {
      steps.push({ id: 'offres', title: 'Regarder les offres près de chez vous',
        text: 'Des offres où les débutants sont acceptés' + (dispo.length ? ', ' + joinFr(dispo) : '') + '.' + (exp.length || state.free ? ' Vos expériences comptent : parlez-en à l\'employeur.' : ''),
        action: ['Voir les offres', 'briefcase', 'Offres d\'emploi, filtrées « débutant accepté »'],
        why: (projet ? why('projet') : why('situation')) + (exp.length ? ' Vos expériences : ' + joinFr(list('experiences')) + '.' : '') });
    } else if (projet === 'formation') {
      steps.push({ id: 'formation', title: 'Choisir une formation',
        text: 'Les catalogues de France Travail et de Mon Compte Formation présentent les formations près de chez vous.',
        action: ['Voir les formations', 'book', 'Formations (liens vers France Travail et Mon Compte Formation)'], why: why('projet') });
    } else if (projet === 'creer') {
      steps.push({ id: 'creer', title: 'Être accompagné pour créer votre activité',
        text: 'Une structure peut vous aider à monter votre projet, pas à pas.',
        action: ['Voir les services', 'lifebuoy', 'Annuaire des services d\'aide, besoin « Démarches »'], why: why('projet') });
    } else if (projet === 'ne_sait_pas') {
      steps.push({ id: 'conseiller', title: 'Faire le point avec un conseiller',
        text: 'Un conseiller vous aide à trouver ce qui vous plaît, à partir de ce que vous savez déjà faire.',
        action: ['Être rappelé', 'phone', null, 'rappel'], why: why('projet') });
    }

    if (has('besoins', 'trajet') || has('besoins', 'vehicule_adapte')) {
      steps.push({ id: 'trajet', title: 'Prévoir vos trajets',
        text: 'Le trajet solidaire vous emmène à un entretien, une formation ou un rendez-vous. Il est gratuit pour vous.' + (has('besoins', 'vehicule_adapte') ? ' Vous pouvez demander un véhicule adapté.' : ''),
        action: ['Réserver un trajet', 'car', 'Réservation d\'un trajet, motif « Entretien d\'embauche »'], why: 'Vous avez dit avoir besoin de : « ' + ['trajet', 'vehicule_adapte'].filter((c) => has('besoins', c)).map((c) => label('besoins', c)).join(' », « ') + ' ».' });
    }
    const NEEDS = [
      ['garde', 'Trouver une solution de garde', 'Des services de garde d\'enfants, avec leurs horaires et les langues parlées.', 'Garde d\'enfants'],
      ['logement', 'Trouver de l\'aide pour le logement', 'Des services qui aident à trouver ou à garder un logement.', 'Logement'],
      ['demarches', 'Être aidé pour vos démarches', 'Des services et des fiches « Comment faire ? » en langage simple, à écouter.', 'Démarches'],
      ['numerique', 'Apprendre à utiliser le téléphone et internet', 'Des ateliers gratuits près de chez vous.', 'Numérique'],
      ['francais', 'Mieux lire et écrire le français', 'Des cours de savoirs de base, gratuits.', 'Formation, savoirs de base'],
      ['equipement', 'Trouver des vêtements ou du matériel de travail', 'Des services qui prêtent ou donnent l\'équipement.', 'Équipement']
    ];
    for (const [code, title, text, cat] of NEEDS) {
      if (has('besoins', code)) steps.push({ id: code, title, text, action: ['Voir les services', 'lifebuoy', 'Annuaire des services d\'aide, besoin « ' + cat + ' »'], why: 'Vous avez dit avoir besoin de : « ' + label('besoins', code) + ' ».' });
    }
    // French not among the languages spoken: French lessons, even if not asked.
    const langs = state.answers.langues || [];
    if (!has('besoins', 'francais') && langs.length && !langs.includes('fr')) {
      steps.push({ id: 'francais_auto', title: 'Apprendre le français',
        text: 'Des cours gratuits près de chez vous. En attendant, l\'application existe dans votre langue.',
        action: ['Voir les services', 'lifebuoy', 'Annuaire des services d\'aide, besoin « Formation, savoirs de base »'], why: 'Vous avez dit parler : ' + joinFr(langs.map((l) => label('langues', l))) + '.' });
    }
    // No phone with internet and no computer: a digital step, even if not asked.
    const eq = state.answers.equipement_numerique || [];
    if (!has('besoins', 'numerique') && eq.length && !eq.includes('smartphone') && !eq.includes('ordinateur')) {
      steps.push({ id: 'numerique_auto', title: 'Avoir accès à internet',
        text: 'Des lieux près de chez vous prêtent un ordinateur et aident à l\'utiliser.',
        action: ['Voir les services', 'lifebuoy', 'Annuaire des services d\'aide, besoin « Numérique »'], why: why('equipement_numerique') });
    }
    // Fillers: always useful, never a decision about the person.
    const fillers = [
      { id: 'entretien', title: 'Préparer votre entretien', text: 'Une fiche simple : quoi dire, quoi apporter, comment y aller.',
        action: ['Lire la fiche', 'book', 'Fiche pratique « Comment faire ? » : préparer un entretien'], why: 'Proposée à tout le monde qui cherche un travail.' },
      { id: 'conseiller', title: 'Parler de votre projet avec un conseiller', text: 'Il peut compléter ce plan avec vous.',
        action: ['Être rappelé', 'phone', null, 'rappel'], why: 'Proposée à tout le monde : ce plan n\'est qu\'un point de départ.' }
    ];
    for (const f of fillers) {
      if (steps.length >= 3) break;
      if (!steps.some((s) => s.id === f.id)) steps.push(f);
    }
    return steps.slice(0, 5);
  }

  // --- Screens --------------------------------------------------------------------------
  const SCREENS = [
    ['offres', 'Offres d\'emploi : l\'entrée'],
    ['intro', 'Faire le point'],
    ...QUESTIONS.map((q, i) => ['q' + (i + 1), 'Question ' + (i + 1) + ' : ' + q.code.replace('_', ' ')]),
    ['plan', 'Mon plan d\'action'],
    ['rappel', 'Être rappelé'],
    ['rappel-ok', 'Être rappelé : demande enregistrée'],
    ['garder', 'Garder mon plan'],
    ['accueil', 'Accueil, une fois connecté']
  ];
  let current = 'offres';

  const header = (action) => '<header class="header"><a class="brand" href="#offres" data-go="offres"><svg viewBox="0 0 64 64" aria-hidden="true"><rect class="logo-ground" width="64" height="64" rx="14"/><path class="logo-road" d="M14 44h36M20 44l6-20h12l6 20"/><circle class="logo-sun" cx="32" cy="16" r="5"/></svg>En route pour l\'emploi</a>' + (action ? '<button type="button" class="header-action" data-toast="' + esc(action[1]) + '">' + action[0] + '</button>' : '') + '</header>';
  const motif = '<svg class="hero-motif" width="150" height="150" viewBox="0 0 64 64" aria-hidden="true"><path d="M14 44h36M20 44l6-20h12l6 20"/><circle cx="32" cy="16" r="5"/></svg>';
  const hero = (title, opts = {}) => '<section class="hero">' + motif +
    (opts.eyebrow ? '<p class="hero-eyebrow">' + opts.eyebrow + '</p>' : '') +
    '<h1 class="hero-title" id="screen-title" tabindex="-1">' + title + '</h1>' +
    (opts.lead ? '<p class="hero-lead">' + opts.lead + '</p>' : '') +
    (opts.progress ? '<div class="progress" aria-hidden="true">' + Array.from({ length: opts.progress[1] }, (_, i) => '<span class="progress-step' + (i < opts.progress[0] ? ' progress-step-done' : '') + '"></span>').join('') + '</div>' : '') +
    '</section>';
  const footer = '<footer class="footer"><label class="visually-hidden" for="lang">Langue</label><select id="lang"><option>Français</option><option>Kréyòl gwiyanè</option><option>Kreyòl ayisyen</option><option>Português (Brasil)</option><option>English</option></select><p>Projet étudiant — démonstrateur · <a href="#offres" data-toast="Page « À propos » (existante)">À propos</a></p></footer>';
  const card = (cls, ic, title, hint, attrs) => '<button type="button" class="action-card ' + cls + '" ' + attrs + '><span class="icon-chip">' + icon(ic) + '</span><span class="action-card-text"><span class="action-card-title">' + title + '</span>' + (hint ? '<span class="action-card-hint">' + hint + '</span>' : '') + '</span>' + icon('arrow', 'action-card-arrow') + '</button>';

  function screenOffres() {
    return header(['Se connecter', 'Page de connexion (existante)']) + hero('Offres d\'emploi', { lead: 'Des offres fictives près de chez vous.' }) +
      '<main class="sheet">' +
      card('action-card-sun', 'compass', 'Je ne sais pas par où commencer', 'Faites le point en 7 questions. Environ 5 minutes.', 'data-go="intro"') +
      '<div class="stack ghost" aria-hidden="true">' +
      '<p class="note" style="margin:0">Filtres et offres : écran existant, montré en grisé.</p>' +
      '<div class="offer-card"><p><strong>Agent d\'entretien (H/F)</strong></p><p>Nettoyage Plus · Cayenne</p><p class="note">Le matin · Débutant accepté · Sans diplôme</p></div>' +
      '<div class="offer-card"><p><strong>Aide de cuisine (H/F)</strong></p><p>Le Carbet du Port · Rémire-Montjoly</p><p class="note">Le soir · Débutant accepté</p></div>' +
      '</div></main>' + footer;
  }

  function screenIntro() {
    return header() + hero('Faire le point', { lead: 'Quelques questions pour vous proposer un plan d\'action.' }) +
      '<main class="sheet">' +
      '<ul class="benefits">' +
      '<li class="benefit"><span class="icon-chip">' + icon('list') + '</span>7 questions, environ 5 minutes.</li>' +
      '<li class="benefit"><span class="icon-chip">' + icon('check') + '</span>Il n\'y a pas de bonne ou de mauvaise réponse.</li>' +
      '<li class="benefit"><span class="icon-chip">' + icon('restart') + '</span>Vous pouvez passer une question.</li>' +
      '</ul>' +
      '<p class="note">Nous ne demandons rien sur vos papiers ni sur votre santé. Vos réponses sont gardées seulement si vous avez un compte.</p>' +
      '<button type="button" class="button" data-go="q1">Commencer</button>' +
      '</main>' + footer;
  }

  function screenQuestion(i) {
    const q = QUESTIONS[i];
    const chosen = state.answers[q.code] || [];
    const type = q.multi ? 'checkbox' : 'radio';
    const opts = q.options.map(([code, text, ic, hint]) =>
      '<label class="choice"><input type="' + type + '" name="' + q.code + '" value="' + code + '"' + (chosen.includes(code) ? ' checked' : '') + ' data-q="' + q.code + '">' +
      '<span class="icon-chip">' + icon(ic) + '</span><span class="choice-text">' + text + (hint ? '<span class="choice-hint">' + hint + '</span>' : '') + '</span></label>').join('');
    const last = i === QUESTIONS.length - 1;
    const next = last ? 'plan' : 'q' + (i + 2);
    const prev = i === 0 ? 'intro' : 'q' + i;
    return header() + hero(q.title, { eyebrow: 'Question ' + (i + 1) + ' sur ' + QUESTIONS.length, progress: [i + 1, QUESTIONS.length] }) +
      '<main class="sheet">' +
      (q.hint ? '<p class="choices-hint" id="hint-' + q.code + '">' + q.hint + '</p>' : '') +
      '<fieldset class="choices"' + (q.hint ? ' aria-describedby="hint-' + q.code + '"' : '') + '><legend class="visually-hidden">' + q.title + '</legend>' + opts + '</fieldset>' +
      (q.free ? '<div class="field"><label class="field-label" for="free">' + q.free.label + '</label><input class="field-input" id="free" type="text" autocomplete="off" placeholder="' + esc(q.free.placeholder) + '" value="' + esc(state.free) + '"></div>' : '') +
      '<div class="step-nav"><button type="button" class="button" data-go="' + next + '">' + (last ? 'Voir mon plan d\'action' : 'Suivant') + '</button>' +
      (chosen.length ? '' : '<button type="button" class="link-action" data-go="' + next + '">Passer cette question</button>') +
      '<button type="button" class="link-action" data-go="' + prev + '">' + icon('back') + 'Retour</button></div>' +
      '</main>' + footer;
  }

  function screenPlan() {
    const steps = buildPlan();
    const doneCount = steps.filter((s) => state.done[s.id]).length;
    const items = steps.map((s) => {
      const done = !!state.done[s.id];
      const [actLabel, actIcon, actTarget, actGo] = s.action;
      const actAttrs = actGo ? 'data-go="' + actGo + '"' : 'data-toast="Ouvre l\'écran existant : ' + esc(actTarget) + '"';
      return '<li class="plan-step' + (done ? ' is-done' : '') + '">' +
        '<div class="plan-step-head"><h2 class="plan-step-title">' + s.title + (done ? ' <span class="badge">Fait</span>' : '') + '</h2></div><div class="plan-step-body">' +
        '<p>' + esc(s.text) + '</p>' +
        '<details class="why"><summary>Pourquoi cette proposition ?</summary><p>' + esc(s.why) + '</p></details>' +
        '<button type="button" class="button button-secondary" ' + actAttrs + '>' + icon(actIcon) + actLabel + '</button>' +
        '<label class="checkbox"><input type="checkbox" data-done="' + s.id + '"' + (done ? ' checked' : '') + '>C\'est fait</label>' +
        '</div></li>';
    }).join('');
    return header(state.loggedIn ? ['Se déconnecter', 'Déconnexion'] : ['Se connecter', 'Page de connexion (existante)']) +
      hero('Mon plan d\'action', { lead: steps.length + ' étapes proposées d\'après vos réponses.' }) +
      '<main class="sheet">' +
      '<p class="alert alert-info">Ce plan est une proposition. Vous pouvez le changer avec un conseiller.</p>' +
      '<p class="plan-count" aria-live="polite">' + doneCount + ' étape' + (doneCount > 1 ? 's' : '') + ' faite' + (doneCount > 1 ? 's' : '') + ' sur ' + steps.length + '</p>' +
      '<ol class="plan-steps">' + items + '</ol>' +
      '<section class="panel"><h2 class="panel-title">Parler à quelqu\'un</h2><p>Un conseiller peut vous rappeler pour parler de ce plan.</p>' +
      '<button type="button" class="button button-secondary" data-go="rappel">' + icon('phone') + 'Être rappelé</button></section>' +
      (state.loggedIn ? '<p class="note">Votre plan est gardé dans votre compte.</p>' : '<button type="button" class="button" data-go="garder">Garder mon plan</button>') +
      '<button type="button" class="link-action" data-go="q1">Modifier mes réponses</button>' +
      '</main>' + footer;
  }

  function screenRappel() {
    const when = [['matin', 'Le matin'], ['apres_midi', 'L\'après-midi'], ['peu_importe', 'Peu importe']];
    return header() + hero('Être rappelé', { lead: 'Un conseiller vous appelle pour parler de votre plan.' }) +
      '<main class="sheet">' +
      '<div class="field"><label class="field-label" for="phone">Votre numéro de téléphone</label><input class="field-input" id="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="0694 12 34 56" value="' + esc(state.phone) + '"></div>' +
      '<fieldset class="choices"><legend class="field-label">Quand préférez-vous être appelé ?</legend>' +
      when.map(([c, t]) => '<label class="choice"><input type="radio" name="when" value="' + c + '"' + (state.when === c ? ' checked' : '') + ' data-when>' + t + '</label>').join('') +
      '</fieldset>' +
      '<p class="note">Le conseiller rappelle aux heures d\'ouverture de la structure. Ce service ne traite pas les urgences.</p>' +
      '<button type="button" class="button" data-go="rappel-ok">Demander à être rappelé</button>' +
      '<button type="button" class="link-action" data-go="plan">' + icon('back') + 'Revenir à mon plan</button>' +
      '</main>' + footer;
  }

  function screenRappelOk() {
    const when = { matin: 'le matin', apres_midi: 'l\'après-midi', peu_importe: 'dès que possible' }[state.when];
    return header() + hero('Être rappelé') +
      '<main class="sheet">' +
      '<p class="alert alert-success" role="status">Demande enregistrée.</p>' +
      '<p class="lead">Un conseiller vous appellera ' + when + (state.phone ? ' au <strong>' + esc(state.phone) + '</strong>' : '') + '.</p>' +
      '<p class="note">Vous ne serez pas appelé par un robot.</p>' +
      '<button type="button" class="button" data-go="plan">Revenir à mon plan</button>' +
      '</main>' + footer;
  }

  function screenGarder() {
    return header() + hero('Garder mon plan', { lead: 'Pour le retrouver plus tard, il faut un compte.' }) +
      '<main class="sheet">' +
      '<p>Sans compte, votre plan et vos réponses sont effacés quand vous fermez l\'application.</p>' +
      '<p class="note">Avec un compte, nous gardons seulement vos réponses et votre plan. Vous pouvez demander à les effacer.</p>' +
      '<div class="step-nav"><button type="button" class="button" data-login>Créer un compte</button>' +
      '<button type="button" class="button button-secondary" data-login>J\'ai déjà un compte</button>' +
      '<button type="button" class="link-action" data-go="plan">' + icon('back') + 'Revenir à mon plan</button></div>' +
      '</main>' + footer;
  }

  function screenAccueil() {
    const steps = buildPlan();
    const doneCount = steps.filter((s) => state.done[s.id]).length;
    return header(['Se déconnecter', 'Déconnexion']) + hero('Bonjour Jordan', { lead: 'De quoi avez-vous besoin aujourd\'hui ?' }) +
      '<main class="sheet"><div class="stack" style="margin-top:0">' +
      card('need-work', 'briefcase', 'Je cherche un travail', null, 'data-go="offres"') +
      card('need-ride', 'car', 'J\'ai besoin d\'un trajet', null, 'data-toast="Réservation d\'un trajet (existante)"') +
      card('need-help', 'lifebuoy', 'J\'ai besoin d\'aide', null, 'data-toast="Page « J\'ai besoin d\'aide » (existante)"') +
      '</div><div class="stack">' +
      '<button type="button" class="link-action" data-go="plan">' + icon('list') + 'Mon plan d\'action <span class="badge">' + doneCount + ' sur ' + steps.length + '</span></button>' +
      '<button type="button" class="link-action" data-toast="Mes trajets (existant)">' + icon('calendar') + 'Mes trajets</button>' +
      '<button type="button" class="link-action" data-toast="Mon profil (existant)">' + icon('user') + 'Mon profil</button>' +
      '</div></main>' + footer;
  }

  // --- Notes for the review with the client -------------------------------------------
  const ask = (t) => '<p class="ask"><strong>À valider avec vous</strong>' + t + '</p>';
  function notes(id) {
    const qNotes = {
      q1: ['Pas de case « autre » : la personne peut passer la question.', ask('Manque-t-il une situation fréquente chez les personnes que vous accompagnez ?')],
      q2: ['Cette réponse choisit la première étape du plan.', ask('Ces quatre projets suffisent-ils ?')],
      q3: ['Les expériences sans salaire comptent (cahier des charges §7.1) : l\'abattis, la pêche, la garde d\'enfants…', 'Un champ libre, facultatif, pour le reste.', ask('Quelles expériences sont les plus courantes en Guyane ? Faut-il en ajouter ?')],
      q4: ['Sert à filtrer les offres proposées dans le plan.', ask('Faut-il demander aussi quand la personne peut commencer ?')],
      q5: ['Les freins sont écrits comme des besoins, jamais comme un diagnostic ni une situation de séjour (§7.1, §12).', 'Chaque besoin mène à un service de l\'annuaire, déjà fait.', ask('La liste vous convient-elle ? Manque-t-il un besoin ?')],
      q6: ['Sert à proposer des services qui parlent la langue de la personne, et des cours de français si besoin.', ask('Quelles langues ajouter ou retirer (hmong, langues amérindiennes, sranan tongo…) ?')],
      q7: ['Sert à proposer un accompagnement au numérique. Aucune réponse ne bloque l\'accès à quoi que ce soit.', ask('La question est-elle claire ainsi ?')]
    };
    const N = {
      offres: ['<h2>L\'entrée du questionnaire</h2><ul><li>L\'accueil garde ses trois besoins : au plus 3 actions principales par écran (§10).</li><li>Le questionnaire s\'ouvre depuis « Je cherche un travail », là où commence le parcours de Jordan (scénario A).</li></ul>' + ask('Ce point d\'entrée vous semble-t-il naturel ? Faut-il aussi le proposer dans « J\'ai besoin d\'aide » ?')],
      intro: ['<h2>Avant de commencer</h2><ul><li>Le cahier des charges demande 10 minutes au plus : 7 questions à choix, environ 5 minutes.</li><li>On ne demande rien sur les papiers, l\'origine ou la santé (§12).</li><li>Pas besoin de compte pour répondre. Sans compte, rien n\'est gardé.</li></ul>'],
      plan: ['<h2>Le plan d\'action</h2><ul><li>3 à 5 étapes, calculées par des règles simples écrites à l\'avance (tableau ci-dessous).</li><li>Chaque étape dit pourquoi elle est proposée.</li><li>C\'est une proposition : un conseiller peut toujours la changer. Aucune décision automatique (RGPD art. 22).</li><li>Les boutons ouvrent les écrans déjà faits : offres, trajet, annuaire, fiches.</li><li>La personne coche les étapes faites.</li></ul>' +
        '<div class="mock-table-wrap"><table><thead><tr><th>Si la personne répond</th><th>Étape proposée</th></tr></thead><tbody>' +
        '<tr><td>Trouver un travail rapidement</td><td>Regarder les offres (débutant accepté, ses horaires)</td></tr>' +
        '<tr><td>Apprendre un métier</td><td>Choisir une formation</td></tr>' +
        '<tr><td>Créer mon activité</td><td>Être accompagné (annuaire)</td></tr>' +
        '<tr><td>Je ne sais pas encore</td><td>Faire le point avec un conseiller</td></tr>' +
        '<tr><td>Besoin d\'un trajet ou d\'un véhicule adapté</td><td>Prévoir vos trajets</td></tr>' +
        '<tr><td>Chaque autre besoin</td><td>Le service de l\'annuaire qui y répond</td></tr>' +
        '<tr><td>Ne parle pas français</td><td>Apprendre le français</td></tr>' +
        '<tr><td>Ni téléphone avec internet, ni ordinateur</td><td>Avoir accès à internet</td></tr>' +
        '<tr><td>Moins de 3 étapes</td><td>Préparer votre entretien, puis parler avec un conseiller</td></tr>' +
        '</tbody></table></div>' + ask('Ces règles vous conviennent-elles ? Qui est le conseiller : quelqu\'un de votre structure ?')],
      rappel: ['<h2>Être rappelé</h2><ul><li>Le contact humain demandé par le cahier des charges (§7.1).</li><li>La demande est enregistrée ; quelqu\'un de la structure rappelle.</li><li>On ne promet aucun service d\'urgence (§6).</li></ul>' + ask('Qui rappelle, et dans quel délai ? Quels sont vos horaires ?')],
      'rappel-ok': ['<h2>Demande enregistrée</h2><ul><li>Ce message ne s\'affiche qu\'une fois la demande reçue par le serveur : jamais de fausse confirmation.</li></ul>'],
      garder: ['<h2>Garder son plan</h2><ul><li>Sans compte, rien n\'est gardé : on ne demande que ce qui sert (§2).</li><li>Avec un compte, on garde les réponses et le plan. La personne peut demander qu\'on les efface.</li></ul>'],
      accueil: ['<h2>Retrouver son plan</h2><ul><li>Une fois connecté, le plan se retrouve depuis l\'accueil, avec le nombre d\'étapes faites.</li><li>Les trois besoins restent les seules actions principales.</li></ul>']
    };
    if (qNotes[id]) {
      const [first, ...rest] = qNotes[id];
      const qi = Number(id.slice(1)) - 1;
      const asks = rest.filter((x) => x.startsWith('<p'));
      const lis = [first, ...rest.filter((x) => !x.startsWith('<p'))];
      return '<h2>Question ' + (qi + 1) + ' sur 7</h2><ul>' + lis.map((l) => '<li>' + l + '</li>').join('') + '<li>Les réponses sont des tuiles avec une icône et un texte : jamais une icône seule (§6).</li></ul>' + asks.join('');
    }
    return (N[id] || []).join('');
  }

  // --- Rendering and events ---------------------------------------------------------
  const device = document.getElementById('device');
  const notesEl = document.getElementById('notes');
  const select = document.getElementById('screen-select');
  select.innerHTML = SCREENS.map(([id, name], i) => '<option value="' + id + '">' + (i + 1) + '. ' + name + '</option>').join('');

  function render(focus) {
    let html;
    if (current === 'offres') html = screenOffres();
    else if (current === 'intro') html = screenIntro();
    else if (/^q\d$/.test(current)) html = screenQuestion(Number(current.slice(1)) - 1);
    else if (current === 'plan') html = screenPlan();
    else if (current === 'rappel') html = screenRappel();
    else if (current === 'rappel-ok') html = screenRappelOk();
    else if (current === 'garder') html = screenGarder();
    else html = screenAccueil();
    device.innerHTML = '<div class="screen-enter">' + html + '</div>';
    notesEl.innerHTML = '<p class="mock-tag" style="margin:0 0 var(--space-s)">Note de maquette</p>' + notes(current);
    select.value = current;
    if (focus) {
      const t = document.getElementById('screen-title');
      if (t) t.focus({ preventScroll: true });
      device.scrollIntoView({ block: 'start' });
    }
  }

  function go(id) {
    if (!SCREENS.some((s) => s[0] === id)) id = 'offres';
    current = id;
    if (location.hash !== '#' + id) history.replaceState(null, '', '#' + id);
    render(true);
  }

  let toastTimer;
  function toast(text) {
    const el = document.getElementById('toast');
    el.textContent = text;
    el.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { el.hidden = true; }, 2800);
  }

  device.addEventListener('click', (e) => {
    const t = e.target.closest('[data-go], [data-toast], [data-login]');
    if (!t) return;
    e.preventDefault();
    if (t.hasAttribute('data-login')) {
      state.loggedIn = true;
      toast('Connexion ou création de compte (écrans existants), puis retour au plan, désormais gardé.');
      go('plan');
    } else if (t.dataset.go) go(t.dataset.go);
    else toast(t.dataset.toast);
  });

  device.addEventListener('change', (e) => {
    const t = e.target;
    if (t.dataset.q) {
      const q = QUESTIONS.find((x) => x.code === t.dataset.q);
      let chosen = state.answers[q.code] || [];
      if (!q.multi) chosen = [t.value];
      else if (t.checked) {
        const exclusive = q.options.find((o) => o[0] === t.value)[4];
        chosen = exclusive ? [t.value] : chosen.filter((c) => !q.options.find((o) => o[0] === c)[4]).concat(t.value);
      } else chosen = chosen.filter((c) => c !== t.value);
      state.answers[q.code] = chosen;
      // Re-render to reflect exclusive choices and the "Passer" link, keeping focus.
      render(false);
      const again = device.querySelector('input[data-q="' + q.code + '"][value="' + t.value + '"]');
      if (again) again.focus();
    } else if (t.dataset.done) {
      state.done[t.dataset.done] = t.checked;
      render(false);
      const again = device.querySelector('input[data-done="' + t.dataset.done + '"]');
      if (again) again.focus();
    } else if (t.hasAttribute('data-when')) {
      state.when = t.value;
    }
  });
  device.addEventListener('input', (e) => {
    if (e.target.id === 'free') state.free = e.target.value;
    if (e.target.id === 'phone') state.phone = e.target.value;
  });

  select.addEventListener('change', () => go(select.value));
  document.getElementById('fill-jordan').addEventListener('click', () => {
    state = JSON.parse(JSON.stringify(JORDAN));
    toast('Réponses de Jordan, 22 ans, sans permis (scénario A).');
    go('plan');
  });
  document.getElementById('reset').addEventListener('click', () => { state = empty(); go('offres'); });
  window.addEventListener('hashchange', () => go(location.hash.slice(1)));

  current = location.hash.slice(1) || 'offres';
  if (!SCREENS.some((s) => s[0] === current)) current = 'offres';
  // Opened straight on a later screen: show it filled, as Jordan.
  if (!['offres', 'intro', 'q1'].includes(current)) state = JSON.parse(JSON.stringify(JORDAN));
  render(false);
})();
</script>
