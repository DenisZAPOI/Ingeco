# Serves the built interface (FRONTEND/Dockerfile).
server {
    listen 5173;
    root /usr/share/nginx/html;

    # Compressed text: fewer bytes on a slow network (Regular 2G target).
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

    # Files whose name changes with each build: kept a year by the browser.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Never cached: a new version of the app must be seen at the next visit.
    location ~ ^/(index\.html|sw\.js|registerSW\.js|manifest\.webmanifest)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # React routes (/trajets/12, /connexion…): the app itself answers.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
