# L'application complète en local, pour une démonstration : la base MySQL,
# l'API et l'interface (développement et démo seulement, jamais en ligne).
#   docker compose up -d --build   tout lancer : http://localhost:5173
#   docker compose up -d db        la base seule (pour lancer l'API et
#                                  l'interface à la main, README partie 4)
#   docker compose down            tout arrêter
#   docker compose down -v         tout arrêter et EFFACER la base (pour recharger sql/)
#
# Image officielle plutôt qu'une image Alpine : il n'existe pas de MySQL
# officiel sur Alpine, et les images tierces (souvent MariaDB) ne sont ni
# maintenues par l'éditeur ni tout à fait le même moteur. Le réglage
# ci-dessous limite la mémoire à environ 250 Mo.
services:
  db:
    image: mysql:8.4
    container_name: enroute-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?à définir dans .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-enroute}
      MYSQL_USER: ${MYSQL_USER:-enroute}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?à définir dans .env}
    command:
      # Horloge du serveur en UTC : convention du contrat d'API (dates en UTC)
      - --default-time-zone=+00:00
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      # Mémoire réduite : le volume du MVP se compte en milliers de lignes
      - --performance-schema=OFF
      - --innodb-buffer-pool-size=64M
      - --skip-name-resolve
    ports:
      # Joignable depuis cet ordinateur seulement, pas depuis le réseau
      - "127.0.0.1:${MYSQL_PORT:-3307}:3306"
    volumes:
      - db-data:/var/lib/mysql
      # Au premier démarrage seulement (base vide), sql/charger-base.sh
      # charge le schéma, puis sql/migrations/ dans l'ordre, puis
      # sql/demo-data.sql. Le script hors MVP n'est pas chargé : l'API ne
      # s'en sert pas. demo-data.sql contient des comptes au mot de passe
      # public : base locale seulement, jamais dans un environnement hébergé.
      - ./sql:/sql:ro
      - ./sql/charger-base.sh:/docker-entrypoint-initdb.d/charger-base.sh:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 3s
      retries: 20

  # L'API en mode démo : comptes de test (mot de passe public) et cookies sur
  # http. Les données restent en mémoire tant que les repository/ ne sont pas
  # branchés sur la base : elles reviennent à zéro à chaque redémarrage.
  api:
    build: ./BACKEND
    container_name: enroute-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-enroute}:${MYSQL_PASSWORD:?à définir dans .env}@db:3306/${MYSQL_DATABASE:-enroute}?charset=utf8mb4
      FLASK_SECRET_KEY: ${FLASK_SECRET_KEY:?à définir dans .env}
      # Dans le conteneur : écoute sur toutes ses interfaces. Le port n'est
      # publié que sur 127.0.0.1 (plus bas).
      HOST: 0.0.0.0
      PORT: 5000
      CORS_ORIGINS: http://localhost:5173
      FLASK_DEBUG: "false"
      COOKIE_SECURE: "false"
      LOAD_DEMO_DATA: "true"
      API_DOCS_ENABLED: "true"
      LOG_LEVEL: INFO
      LOG_FORMAT: text
      ORS_API_KEY: ${ORS_API_KEY:-}
    ports:
      - "127.0.0.1:5000:5000"

  # L'interface compilée, servie par nginx (FRONTEND/Dockerfile et nginx.conf).
  web:
    build:
      context: ./FRONTEND
      args:
        VITE_API_URL: http://localhost:5000
    container_name: enroute-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "127.0.0.1:5173:5173"

  # Base des tests automatiques (pytest), lancée seulement à la demande :
  #   docker compose --profile test up -d db-test
  # Jetable : en mémoire (tmpfs), rien sur le disque, effacée à l'arrêt. Les
  # tests la vident et la recréent depuis sql/ à chaque lancement : elle ne
  # contient jamais rien d'utile, d'où un mot de passe fixe, connu, et un port
  # ouvert seulement sur cet ordinateur. Jamais la base de développement.
  db-test:
    image: mysql:8.4
    container_name: enroute-db-test
    profiles: ["test"]
    environment:
      MYSQL_ROOT_PASSWORD: tests-only
    command:
      - --default-time-zone=+00:00
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --performance-schema=OFF
      - --innodb-buffer-pool-size=64M
      - --skip-name-resolve
      # Rien n'est à protéger : on échange la durabilité contre la vitesse.
      - --innodb-flush-log-at-trx-commit=0
      - --skip-log-bin
    tmpfs:
      - /var/lib/mysql
    ports:
      - "127.0.0.1:3308:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  db-data:
